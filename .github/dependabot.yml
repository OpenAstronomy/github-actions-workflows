version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: ".github/workflows" # Location of package manifests
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
